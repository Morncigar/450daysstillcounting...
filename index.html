<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f6d9df" />

  <title>for you.</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- =========================
       OPENING SCREEN
  ========================== -->
  <section class="opening-screen" id="openingScreen">
    <div class="opening-content">
      <p class="opening-kicker">hey, kamu.</p>

      <h1>
        ini bukan game,<br />
        tapi coba mainin aja.
      </h1>

      <button class="enter-button" id="enterButton">
        okay??
      </button>
    </div>
  </section>


  <!-- =========================
       MAIN APP
  ========================== -->
  <main class="app" id="app">

    <!-- =========================
         MAIN WORLD
    ========================== -->
    <section class="world-section" id="worldSection">

      <div class="world-shell">

        <!-- background -->
        <img
          src="assets/backgrounds/mainworld-mobile.webp"
          alt=""
          class="world-background"
          draggable="false"
        />

        <!-- heading -->
        <div class="world-copy">
          <p class="world-caption">
            tap anything.<br />
            most of them have a story.
          </p>
        </div>


        <!-- =========================
             CLICKABLE OBJECTS
        ========================== -->

        <!-- VINO -->
        <button
          class="world-object object-vino"
          data-memory="vino"
          aria-label="Open Vino memory"
        >
          <img
            src="assets/objects/2.png"
            alt="Maroon Vino"
            draggable="false"
          />
        </button>


        <!-- TUMBLER -->
        <button
          class="world-object object-tumbler"
          data-memory="tumbler"
          aria-label="Open tumbler memory"
        >
          <img
            src="assets/objects/3.png"
            alt="Pastel tumbler"
            draggable="false"
          />
        </button>


        <!-- KEYCHAIN -->
        <button
          class="world-object object-keychain"
          data-memory="keychain"
          aria-label="Open keychain memory"
        >
          <img
            src="assets/objects/4.png"
            alt="Couple keychain"
            draggable="false"
          />
        </button>


        <!-- GACOAN -->
        <button
          class="world-object object-gacoan"
          data-memory="gacoan"
          aria-label="Open Mie Gacoan memory"
        >
          <img
            src="assets/objects/5.png"
            alt="Mie Gacoan"
            draggable="false"
          />
        </button>


        <!-- GACHA -->
        <button
          class="world-object object-gacha"
          data-memory="gacha"
          aria-label="Open memory gacha"
        >
          <img
            src="assets/objects/6.png"
            alt="Gacha machine"
            draggable="false"
          />
        </button>


        <!-- PHOTOBOX -->
        <button
          class="world-object object-photobox"
          data-memory="photobox"
          aria-label="Open photobox memory"
        >
          <img
            src="assets/objects/7.png"
            alt="Photobox"
            draggable="false"
          />
        </button>


        <!-- CAT -->
        <button
          class="world-object object-cat"
          data-memory="cat"
          aria-label="Open cat memory"
        >
          <img
            src="assets/objects/8.png"
            alt="Cat"
            draggable="false"
          />
        </button>


        <!-- MAILBOX -->
        <button
          class="world-object object-mailbox"
          data-memory="mailbox"
          aria-label="Open letter"
        >
          <img
            src="assets/objects/9.png"
            alt="Mailbox"
            draggable="false"
          />
        </button>


        <!-- SNACK SHELF -->
        <button
          class="world-object object-snacks"
          data-memory="snacks"
          aria-label="Open snack shelf"
        >
          <img
            src="assets/objects/10.png"
            alt="Snack shelf"
            draggable="false"
          />
        </button>


        <!-- WINDOW -->
        <button
          class="world-object object-window"
          data-memory="window"
          aria-label="Open outdoor memories"
        >
          <img
            src="assets/objects/11.png"
            alt="Window"
            draggable="false"
          />
        </button>


        <!-- =========================
             HUD
        ========================== -->
        <div class="world-hud">

          <div class="memory-progress">
            <span id="memoryCount">0</span>
            <span>/</span>
            <span id="memoryTotal">9</span>
            <small>found</small>
          </div>

          <button
            class="hud-button music-button"
            id="musicButton"
            aria-label="Toggle music"
          >
            ♫
          </button>

        </div>

      </div>
    </section>


    <!-- =========================
         LIVE RELATIONSHIP TIMER
    ========================== -->
    <section class="counter-section" id="counterSection">
      <div class="counter-inner">

        <p class="counter-date">
          since 08.06.2025
        </p>

        <div class="counter-days-block">
          <span class="counter-days" id="days">0</span>
          <span class="counter-days-label">days with you</span>
        </div>

        <div class="counter-time">
          <div class="counter-time-unit">
            <span id="hours">00</span>
            <small>hours</small>
          </div>

          <span class="counter-divider">:</span>

          <div class="counter-time-unit">
            <span id="minutes">00</span>
            <small>min</small>
          </div>

          <span class="counter-divider">:</span>

          <div class="counter-time-unit">
            <span id="seconds">00</span>
            <small>sec</small>
          </div>
        </div>

        <p class="still-counting">
          still counting.
        </p>

      </div>
    </section>


    <!-- =========================
         FINAL SECTION
    ========================== -->
    <section class="final-section" id="finalSection">
      <div class="final-inner">

        <p class="final-small">
          08.06.2025 — now
        </p>

        <h2>
          still you.<br />
          still me.
        </h2>

        <p class="final-ending">
          that's all.<br />
          for now.
        </p>

        <span class="final-counting">
          still counting.
        </span>

      </div>
    </section>

  </main>


  <!-- =========================
       MEMORY MODAL
  ========================== -->
  <div
    class="memory-modal"
    id="memoryModal"
    aria-hidden="true"
  >

    <div
      class="memory-backdrop"
      id="memoryBackdrop"
    ></div>

    <article class="memory-card">

      <button
        class="memory-close"
        id="memoryClose"
        aria-label="Close memory"
      >
        ×
      </button>

      <div class="memory-content" id="memoryContent">

        <!-- dynamically replaced by JS -->

      </div>

    </article>

  </div>


  <!-- =========================
       HIDDEN MEMORY TEMPLATES
  ========================== -->
  <template id="memory-vino">
    <div class="memory-template">

      <p class="memory-label">memory 01</p>

      <h2>
        si meru<br />
        <span>alias merah rudet wkwk</span>
      </h2>

      <img
        src="assets/objects/2.png"
        alt="Si Meru"
        class="memory-object-image"
      />

      <p class="memory-text">
        somehow bahkan motor ini
        jadi salah satu hal yang langsung
        bikin aku keinget kamu.
      </p>

    </div>
  </template>


  <template id="memory-tumbler">
    <div class="memory-template">

      <p class="memory-label">memory 02</p>

      <h2>
        that tumbler.
      </h2>

      <img
        src="assets/objects/3.png"
        alt="Pastel tumbler"
        class="memory-object-image"
      />

      <p class="memory-text">
        i don't know why,
        but this color combination is so you.
      </p>

    </div>
  </template>


  <template id="memory-keychain">
    <div class="memory-template">

      <p class="memory-label">memory 03</p>

      <h2>
        you got the white one.<br />
        i got the brown one.
      </h2>

      <img
        src="assets/objects/4.png"
        alt="Couple keychain"
        class="memory-object-image"
      />

      <p class="memory-text">
        separate,
        but they only really make sense together.
      </p>

    </div>
  </template>


  <template id="memory-gacoan">
    <div class="memory-template">

      <p class="memory-label">memory 04</p>

      <h2>
        of course this is here.
      </h2>

      <img
        src="assets/objects/5.png"
        alt="Mie Gacoan"
        class="memory-object-image"
      />

      <p class="memory-text">
        mie gacoan.<br />
        no further explanation needed.
      </p>

    </div>
  </template>


  <template id="memory-snacks">
    <div class="memory-template">

      <p class="memory-label">memory 05</p>

      <h2>
        emergency supplies
      </h2>

      <img
        src="assets/objects/10.png"
        alt="Snack shelf"
        class="memory-object-image"
      />

      <p class="memory-text">
        ciki, pilus, keripik, taro,
        dan apapun yang keliatannya asin.
      </p>

    </div>
  </template>


  <template id="memory-cat">
    <div class="memory-template cat-memory">

      <p class="memory-label">memory 06</p>

      <h2>
        cat.
      </h2>

      <img
        src="assets/objects/8.png"
        alt="Cat"
        class="memory-object-image"
      />

      <p class="memory-text" id="catText">
        you would've stopped walking anyway.
      </p>

      <button
        class="memory-action"
        id="petCatButton"
      >
        pspspspsps
      </button>

    </div>
  </template>


  <template id="memory-photobox">
    <div class="memory-template">

      <p class="memory-label">memory 07</p>

      <h2>
        proof that we were here.
      </h2>

      <video
        class="memory-video"
        autoplay
        muted
        loop
        playsinline
      >
        <source
          src="assets/gifs/photobox/us-photobox-01.webm"
          type="video/webm"
        />
      </video>

      <p class="memory-text">
        one more?
      </p>

    </div>
  </template>


  <template id="memory-window">
    <div class="memory-template">

      <p class="memory-label">memory 08</p>

      <h2>
        outside?
      </h2>

      <p class="memory-text">
        we should go somewhere again.
      </p>

      <div class="memory-gallery">

        <img
          src="assets/photos/her/her-beach-01.webp"
          alt=""
        />

        <img
          src="assets/photos/her/her-rooftop-01.webp"
          alt=""
        />

        <img
          src="assets/photos/us/us-jeep-trip-01.webp"
          alt=""
        />

        <img
          src="assets/photos/us/us-outdoor-selfie-01.webp"
          alt=""
        />

      </div>

    </div>
  </template>


  <template id="memory-mailbox">
    <div class="memory-template letter-memory">

      <p class="memory-label">memory 09</p>

      <h2>
        for you.
      </h2>

      <p class="memory-letter-intro">
        okay.<br />
        this one isn't a game.
      </p>

      <div class="letter-body">

        <p>
          nanti surat aslinya kita taro di sini.
        </p>

        <p>
          bagian ini sengaja belum gue isi final
          karena ini harus bener-bener dari lo.
        </p>

        <p>
          bukan template.
          bukan quote pinterest.
          bukan kalimat AI.
        </p>

      </div>

    </div>
  </template>


  <template id="memory-gacha">
    <div class="memory-template gacha-memory">

      <p class="memory-label">memory gacha</p>

      <h2>
        pull one.
      </h2>

      <img
        src="assets/objects/6.png"
        alt="Gacha machine"
        class="memory-object-image"
      />

      <button
        class="memory-action"
        id="gachaPullButton"
      >
        pull
      </button>

      <div
        class="gacha-result"
        id="gachaResult"
      ></div>

    </div>
  </template>


  <!-- =========================
       AUDIO
  ========================== -->
  <audio
    id="backgroundMusic"
    loop
    preload="metadata"
  >
    <!-- isi nanti -->
    <!--
    <source src="assets/audio/background.mp3" type="audio/mpeg" />
    -->
  </audio>


  <script src="script.js"></script>

</body>
</html>
